<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}تبدیل ویس به متن{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ---- پالت آبی ---- */
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-deep: #1e3a8a;
            --primary-soft: #eaf2ff;
            --primary-softer: #f4f8ff;
            --accent: #0ea5e9;

            --bg: #eaf1fd;
            --text: #0f1b33;
            --muted: #64748b;
            --border: #d5e2f7;
            --border-strong: #b5ccf0;

            --ok-bg: #e8f8ef;
            --ok: #15803d;
            --err-bg: #fff0f0;
            --err: #d03a3a;

            --shadow: 0 8px 30px rgba(37, 99, 235, .10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background:
                radial-gradient(1200px 400px at 100% -10%, rgba(59, 130, 246, .18), transparent 60%),
                radial-gradient(900px 400px at 0% 0%, rgba(14, 165, 233, .12), transparent 55%),
                var(--bg);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .topbar {
            background: linear-gradient(135deg, var(--primary-deep) 0%, var(--primary) 55%, #3b82f6 100%);
            box-shadow: 0 4px 18px rgba(30, 58, 138, .25);
            padding: 14px 28px;
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
        }

        .container {
            margin: 28px 28px;
            padding: 0 16px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 28px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 22px;
            color: var(--primary-deep);
        }

        h2 {
            margin: 0 0 16px;
            font-size: 17px;
            color: var(--primary-deep);
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 22px;
        }

        .btn {
            font-family: inherit;
            font-size: 14px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: #fff;
            padding: 10px 16px;
            cursor: pointer;
            transition: .15s;
            color: var(--primary-dark);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-soft);
            border-color: var(--primary);
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .btn.primary {
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: #fff;
            border-color: var(--primary);
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(37, 99, 235, .28);
        }

        .btn.primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-color: var(--primary-dark);
        }

        .btn.success {
            background: var(--ok);
            color: #fff;
            border-color: var(--ok);
            font-weight: 700;
        }

        .btn.success:hover:not(:disabled) {
            background: #116a31;
            border-color: #116a31;
        }

        .btn.danger {
            color: var(--err);
            border-color: #f0c4c4;
        }

        .btn.danger:hover:not(:disabled) {
            background: var(--err-bg);
            border-color: var(--err);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--primary-deep);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 50;
            box-shadow: 0 8px 24px rgba(30, 58, 138, .35);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%);
        }

        .toast.error {
            background: var(--err);
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: #fff;
            }

            .card {
                border: none;
            }
        }
    </style>
    {% block style %}{% endblock %}
</head>

<body>
    <header class="topbar no-print"><a href="{% url 'index' %}" class="brand">🎙️ تبدیل ویس به متن (طراحی شده در اداره کل درمان استان تهران)</a></header>
    <main class="container">{% block content %}{% endblock %}</main>
    <div id="toast" class="toast"></div>

    <script>
        const CSRF = document.querySelector('meta[name=csrf-token]').content;
        function toast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.toggle('error', !!isError);
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }
        async function postJSON(url, data) {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                body: JSON.stringify(data || {}),
            });
            let j = {};
            try { j = await r.json(); } catch (e) { }
            if (!r.ok) throw new Error(j.error || 'خطای سرور');
            return j;
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
